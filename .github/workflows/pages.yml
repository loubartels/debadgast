name: Deploy naar GitHub Pages

on:
  push:
    branches: [claude/badgast-website-hlpmd2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Zo hoeft wie foto's toevoegt geen script te draaien: het uploaden van
      # een foto naar assets/projecten/<project>/ is genoeg, de projectpagina's
      # worden hier automatisch opnieuw opgebouwd.
      - name: Projectpagina's bijwerken
        run: python3 tools/genereer-projecten.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
